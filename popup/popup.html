<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entropilo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="Entropilo Logo" class="brand-icon">
        <div class="brand-text">
          <h1>ENTROPILO</h1>
          <span class="brand-subtitle">Goal-Aware Intervention</span>
        </div>
      </div>
      <div class="status-badge" id="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Active</span>
      </div>
    </header>

    <!-- Intention Card -->
    <section class="card intent-card">
      <div class="card-header">
        <span class="card-label">🎯 Stated Intention</span>
        <button type="button" class="btn-text" id="btn-edit-goal">Edit</button>
      </div>
      <p class="intent-text" id="current-goal">No intention declared yet</p>
    </section>

    <!-- Score & State Gauge -->
    <section class="card score-card">
      <div class="score-header">
        <span class="card-label">🧠 Zombification Score</span>
        <span class="stage-tag" id="stage-tag">Stage 0</span>
      </div>
      <div class="score-display">
        <div class="score-number-wrap">
          <span class="score-value" id="score-val">0</span>
          <span class="score-max">/ 100</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="score-bar" style="width: 0%;"></div>
        </div>
      </div>
      <p class="score-desc" id="score-desc">Browsing purposefully. Entropy dormant.</p>
    </section>

    <!-- Live Signals Grid -->
    <section class="card signals-card">
      <span class="card-label">📊 Observed Signals</span>
      <div class="signals-grid">
        <div class="signal-item">
          <span class="signal-val" id="sig-posts">0</span>
          <span class="signal-name">Posts Scrolled</span>
        </div>
        <div class="signal-item">
          <span class="signal-val" id="sig-links">0</span>
          <span class="signal-name">Links Opened</span>
        </div>
        <div class="signal-item">
          <span class="signal-val" id="sig-velocity">0 px/s</span>
          <span class="signal-name">Scroll Velocity</span>
        </div>
        <div class="signal-item">
          <span class="signal-val" id="sig-time">0s</span>
          <span class="signal-name">Dwell Duration</span>
        </div>
      </div>
    </section>

    <!-- Quick Actions -->
    <section class="action-buttons">
      <button type="button" class="btn btn-secondary" id="btn-reset">
        🔄 Refocus & Reset
      </button>
      <button type="button" class="btn btn-primary" id="btn-force-mirror">
        ⚡ Trigger Mirror Now
      </button>
    </section>

    <!-- Simulator Button -->
    <section class="simulator-launcher">
      <button type="button" class="btn-simulator" id="btn-open-simulator">
        <span class="sim-icon">🧪</span>
        <div class="sim-text">
          <strong>Open EchoNet Feed Simulator</strong>
          <span>Test Entropilo in a sandbox social feed</span>
        </div>
      </button>
    </section>

    <!-- Settings Drawer -->
    <section class="card settings-card">
      <div class="setting-row">
        <label for="select-sensitivity">Sensitivity</label>
        <select id="select-sensitivity">
          <option value="gentle">Gentle</option>
          <option value="balanced" selected>Balanced</option>
          <option value="strict">Strict</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="cb-demo-mode">⚡ 15s Fast Demo Mode</label>
        <input type="checkbox" id="cb-demo-mode">
      </div>

      <div class="setting-row">
        <label for="cb-show-hud">Show In-Page HUD</label>
        <input type="checkbox" id="cb-show-hud">
      </div>
    </section>

    <footer class="popup-footer">
      <span>100% Local • Zero Cloud Telemetry</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
